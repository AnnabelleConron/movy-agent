<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <style>
    /* ── Figma tokens ── */
    :root {
      --bridesmaid: #FAF6F2;
      --mariner:    #2B5CD9;
      --mojo:       #C4603A;
      --persian:    #5A6480;
      --geyser:     #D4D8E6;
      --white:      #FFFFFF;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--bridesmaid);
      color: var(--mariner);
    }

    .screen { display: none; }
    .screen.active { display: flex; }

    /* ══════════════════════════════
       SCREENS 1 & 2 — Entry screens
    ══════════════════════════════ */
    #screen-apikey,
    #screen-name {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bridesmaid);
    }

    .entry-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 60px;
    }

    .entry-input {
      width: 251px;
      height: 44px;
      background: var(--white);
      border: 1px solid var(--geyser);
      border-radius: 16px;
      padding: 0 17px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: var(--persian);
      outline: none;
      transition: border-color 0.15s;
    }
    .entry-input::placeholder { color: var(--persian); opacity: 1; }
    .entry-input:focus { border-color: var(--mariner); }

    .entry-input.shake {
      animation: shake 0.35s ease;
      border-color: var(--mojo);
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-8px); }
      40%       { transform: translateX(8px); }
      60%       { transform: translateX(-6px); }
      80%       { transform: translateX(6px); }
    }

    .cta-btn {
      width: 251px;
      height: 52px;
      background: var(--mariner);
      border: 1px solid var(--mariner);
      border-radius: 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 500;
      color: var(--white);
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .cta-btn:hover { opacity: 0.88; }

    /* ══════════════════════════════
       SCREEN 3 — Home
    ══════════════════════════════ */
    #screen-home {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 100px;
      min-height: 100vh;
      background: var(--bridesmaid);
    }

    /* Movy logo — overflow-hidden crop matching Figma */
    .logo-large {
      position: relative;
      width: 749px;
      height: 297px;
      overflow: hidden;
      pointer-events: none;
    }
    .logo-large img {
      position: absolute;
      width: 168.71%;
      height: 340.4%;
      left: -34.36%;
      top: -120.2%;
      max-width: none;
    }

    .home-buttons {
      display: flex;
      gap: 100px;
    }

    /* ══════════════════════════════
       SCREEN 4 — Chat
    ══════════════════════════════ */
    #screen-chat {
      flex-direction: column;
      height: 100vh;
      background: var(--bridesmaid);
    }

    /* Header */
    .chat-header {
      background: var(--white);
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 84px 60px 24px;
      flex-shrink: 0;
    }

    .logo-header {
      position: relative;
      width: 232px;
      height: 92px;
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
    }
    .logo-header img {
      position: absolute;
      width: 168.71%;
      height: 340.4%;
      left: -34.36%;
      top: -120.2%;
      max-width: none;
    }

    .nav-btn {
      width: 160px;
      height: 44px;
      background: var(--mariner);
      border: 1px solid var(--mariner);
      border-radius: 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 500;
      color: var(--white);
      cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.15s;
    }
    .nav-btn.active           { opacity: 1; }
    .nav-btn:not(.active):hover { opacity: 0.65; }

    /* Messages */
    .message-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 40px 100px;
      scroll-behavior: smooth;
    }

    .msg-row       { display: flex; flex-direction: column; }
    .msg-row.movy  { align-items: flex-start; }
    .msg-row.user  { align-items: flex-end; }

    .bubble {
      max-width: 480px;
      padding: 12px;
      font-size: 14px;
      font-weight: 400;
      line-height: 22.4px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.movy-bubble {
      background: var(--mojo);
      color: var(--white);
      border-radius: 24px 24px 24px 4px;
    }
    .bubble.user-bubble {
      background: var(--white);
      color: var(--mariner);
      border: 1px solid var(--mariner);
      border-radius: 24px 24px 4px 16px;
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 16px;
      background: var(--mojo);
      border-radius: 24px 24px 24px 4px;
      width: fit-content;
    }
    .typing-indicator span {
      display: block;
      width: 7px;
      height: 7px;
      background: rgba(255,255,255,0.75);
      border-radius: 50%;
      animation: dot 1.2s ease-in-out infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot {
      0%, 80%, 100% { transform: scale(0.8); opacity: 0.6; }
      40%            { transform: scale(1.2); opacity: 1; }
    }

    /* Report / snapshot card */
    .report-card {
      max-width: 560px;
      background: var(--white);
      border-left: 3px solid var(--mojo);
      border-radius: 0 12px 12px 0;
      padding: 16px 20px;
      box-shadow: 0 2px 12px rgba(20,26,46,0.08);
    }
    .report-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mojo);
      margin-bottom: 10px;
    }
    .report-body {
      font-size: 14px;
      line-height: 1.7;
      color: #141A2E;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Input row */
    .input-area {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 100px 100px;
      flex-shrink: 0;
    }

    #chat-input {
      flex: 1;
      height: 44px;
      background: var(--white);
      border: 1px solid var(--geyser);
      border-radius: 16px;
      padding: 0 17px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: var(--persian);
      outline: none;
      transition: border-color 0.15s;
    }
    #chat-input::placeholder { color: var(--persian); opacity: 1; }
    #chat-input:focus         { border-color: var(--mariner); }
    #chat-input:disabled      { opacity: 0.5; cursor: not-allowed; }

    #send-btn {
      width: 58px;
      height: 44px;
      background: var(--mariner);
      border: 1px solid var(--mariner);
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    #send-btn:hover:not([disabled]) { opacity: 0.85; }
    #send-btn[disabled] { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
    #send-btn img { width: 20px; height: 20px; display: block; }

    .error-msg {
      font-size: 13px;
      color: #B33A3A;
      padding: 0 100px 8px;
      display: none;
    }
    .error-msg.visible { display: block; }
  </style>
</head>
<body>

  <!-- ══ SCREEN 1: API Key ══ -->
  <div id="screen-apikey" class="screen active">
    <div class="entry-inner">
      <input
        id="api-key-input"
        type="password"
        class="entry-input"
        placeholder="Enter API Key"
        autocomplete="off"
        spellcheck="false"
      />
      <button class="cta-btn" onclick="submitApiKey()">Submit</button>
    </div>
  </div>

  <!-- ══ SCREEN 2: Name ══ -->
  <div id="screen-name" class="screen">
    <div class="entry-inner">
      <input
        id="name-input"
        type="text"
        class="entry-input"
        placeholder="Enter your name"
        autocomplete="off"
        spellcheck="false"
      />
      <button class="cta-btn" onclick="submitName()">Submit</button>
    </div>
  </div>

  <!-- ══ SCREEN 3: Home ══ -->
  <div id="screen-home" class="screen">
    <div class="logo-large">
      <img src="https://www.figma.com/api/mcp/asset/53a80d19-2964-4ac3-a9ff-c01d019cb0be" alt="Movy" />
    </div>
    <div class="home-buttons">
      <button class="cta-btn" onclick="startMode('onboarding')">Start Onboarding</button>
      <button class="cta-btn" onclick="startMode('checkin')">Start Check-in</button>
    </div>
  </div>

  <!-- ══ SCREEN 4: Chat ══ -->
  <div id="screen-chat" class="screen">
    <div class="chat-header">
      <div class="logo-header" onclick="showScreen('screen-home')" title="Back to home">
        <img src="https://www.figma.com/api/mcp/asset/0f1f040a-e996-4286-a8bc-3862e8d4a5e0" alt="Movy" />
      </div>
      <button id="nav-onboarding" class="nav-btn" onclick="switchMode('onboarding')">Onboarding</button>
      <button id="nav-checkin"    class="nav-btn" onclick="switchMode('checkin')">Check-in</button>
    </div>
    <div class="message-area" id="message-area"></div>
    <div class="error-msg" id="error-msg">Something went wrong. Check your API key and try again.</div>
    <div class="input-area">
      <input
        type="text"
        id="chat-input"
        placeholder="Type your answer..."
        autocomplete="off"
        spellcheck="false"
      />
      <button id="send-btn" onclick="handleSend()" aria-label="Send">
        <img src="https://www.figma.com/api/mcp/asset/913b0094-ab02-4e44-a2a4-f5e2323c8c61" alt="" />
      </button>
    </div>
  </div>

  <script>
    // ── System prompts ─────────────────────────────────────────────────────────

    function buildOnboardingPrompt(name) {
      const n = name || 'there';
      return `You are Movy, an AI rehabilitation companion. You are conducting a patient onboarding conversation before their first physiotherapy appointment. Your job is to collect the patient's information through a warm, natural conversation — not a form, not a list of questions, not a clinical intake process.

The patient's name is ${n}. You already know this — do not ask for it.

You collect the following information across the conversation:
- Reason for visiting (injury or condition description)
- Injury history (any relevant previous injuries to the same area or related areas)
- When the current injury occurred
- Work or study situation (occupational context)
- Preferred exercise days and times
- Days never available to exercise
- General activity level outside of physiotherapy
- Goal — what they most want to get back to doing (stored verbatim, never paraphrased)

You ask one question at a time. You never present a list of questions. You never use form-like language. You always acknowledge what the patient has just told you before moving to the next question — a brief, warm acknowledgement, not a lengthy response.

TONE AND VOICE: You are warm, calm, and encouraging. You use simplified vocabulary — never clinical jargon unless the patient uses it first. You are pragmatic and direct — you do not over-celebrate or use hollow affirmations. A simple "Got it", "Thanks for sharing that", or "That makes sense" is enough before moving on. You never refer to yourself in the third person. You never explain that you are an AI. You never mention that you are collecting data or building a profile.

CONVERSATION FLOW — follow this sequence, never skip a step:

Step 1 — Opening and reason for visit: Open with: "Hi ${n}, I'm Movy — I'll be your companion through your rehabilitation programme. Before your appointment with Dr Smith I'd love to hear a bit about what's been going on. What are you coming in for?" This is the primary extraction opportunity — extract as much as possible from this single response. Do not ask follow-up questions for information you can confidently infer.

Step 2 — Injury timing: If the patient has not mentioned when the injury occurred, ask: "When did this happen?" If they already mentioned it, skip silently.

Step 3 — Work and lifestyle: "What does your typical week look like — do you work or study?"

Step 4 — Preferred exercise days and times: "What days and times of the week work best for you to do your exercises?" If they give days but not times, ask: "And is there a time of day that works best — morning, afternoon, or evening?"

Step 5 — Days never available: "Are there any days where you're completely unavailable — days I should never schedule a session?" Skip silently if the patient already volunteered this, or if they have already clearly indicated specific days they cannot do sessions (e.g., "Monday is always flat out", "I can never do Sundays").

Step 6 — Activity level: If the patient has not already made their activity level clear from earlier responses, ask: "How active are you generally outside of physiotherapy?" Skip this step silently if the patient has already established their activity level — for example, if they mentioned playing sport regularly, described a physically demanding job, or otherwise made their level of activity clear. Never prompt them with labels like "low, moderate, or high" — let them describe it in their own words.

Step 7 — Goal anchor: "Last thing — what's something you're looking forward to getting back to when your [injury/condition] is better?" Store the patient's exact words verbatim. Never paraphrase.

Step 8 — Confirmation and close: "Thanks ${n}, that's everything I need. Your appointment with Dr Smith is confirmed. I'll pass this on so Dr Smith knows a bit about you before you arrive." Then immediately generate the patient snapshot.

EXTRACTION RULES: Extract information silently wherever possible. Maximum four follow-up questions across the entire conversation. Never ask for information already given. Never ask the patient directly about previous injuries — if they volunteer injury history, extract it silently and include it in the snapshot. A question like "Have you had any previous injuries?" should never appear in the conversation. The goal anchor is always stored verbatim.

GUARDRAILS: You do not provide medical advice. If the patient asks a clinical question, redirect: "That's a great question for Dr Smith." You never end the conversation early. You never skip the patient snapshot output.

OUTPUT — PATIENT SNAPSHOT: After the confirmation message, say: "Here's a summary I've put together for Dr Smith based on our conversation:" Then display:

---
**Patient Snapshot — generated for Dr Smith**

[A single clinical paragraph in third person, 3–5 sentences, covering: who the patient is (name, occupation, lifestyle), the injury (what happened, body part, mechanism, timing), any relevant history, schedule preferences (preferred days/times, unavailable days), activity level, and goal anchor quoted verbatim in quotation marks. Written as flowing prose, no bullet points.]
---

Then close: "You're all set, ${n}. See you on the other side of your appointment!"

WHAT THIS CONVERSATION MUST NOT DO: Never present questions as a list. Never use the words "intake", "form", "assessment", "data", or "profile". Never ask more than one question per message. Never generate the patient snapshot before the goal anchor has been collected.`;
    }

    function buildCheckinPrompt(name) {
      const n = name || 'Sarah';
      return `CONTEXT LOADED FOR THIS SESSION — you know all of this before the conversation begins, do not ask the patient for any of it:
- Patient name: ${n}
- Physiotherapist: Dr Smith
- Next appointment: 29 April
- Prescribed exercises this session: Lunge stretch, Hip flexor stretch, Cross body shoulder stretch
- Pain threshold configured by Dr Smith: 8/10
- Mid-session flag: During the session, ${n} reported mild pain (below threshold) in their left knee during the lunge stretch

WHO YOU ARE: You are Movy, a rehabilitation companion. This is a post-session check-in. Your job is to check in warmly and extract four categories of clinical data through natural conversation: (1) Pain — what pain was experienced, which exercise, severity 0–10, location, whether still present. (2) Adherence — whether all prescribed exercises were completed. (3) Confidence — how confident ${n} felt. (4) Difficulty — how difficult the session felt overall.

TONE AND VOICE: Warm, calm, and encouraging. Medium warmth — not effusive, not clinical. When pain above threshold is reported, shift to more focused and precise — but never alarming. Never summarise data back to the patient mid-conversation.

OPENING — MANDATORY: Because a mid-session pain flag was raised during the lunge stretch, you must open with exactly: "Hi ${n}, good job completing your session today. You mentioned feeling some discomfort in your left knee during the lunge stretch — before we go through how the rest of it went, is that pain still there now?"

CONVERSATION FLOW — work through categories in this order: Pain → Adherence → Confidence → Difficulty. Do not announce the categories.

PAIN: The lunge stretch pain is already opened on. If pain is gone → acknowledge and ask: "Did you experience any other pain or discomfort during the session?" For any pain reported: ask for a numeric rating 0–10 if not given. If below 8: acknowledge and move on. If 8 or above: ask (1) "Whereabouts exactly did you feel it?" (2) "How would you describe the pain — was it sharp, dull, burning, or something else?" (3) "Is it still there now?" Then say: "Ok, a pain score of [X]/10 is significant. I'll flag this for Dr Smith — they'll have the full details before your appointment. If you experience that level of pain when doing this exercise again, stop and rest." Never reveal the threshold number to the patient. The three clinical follow-up questions for above-threshold pain do not count against the follow-up limit.

ADHERENCE: Ask: "Did you manage to complete all of your exercises today?" If yes → move on. If partial → ask which were skipped. If none → ask why, encourage, close. Skip confidence and difficulty if none completed.

CONFIDENCE: Ask: "How confident did you feel doing the exercises?" If concern about a specific exercise → ask which one. One follow-up only.

DIFFICULTY: Ask: "How difficult did you find the session overall?" If hard/exhausting → "It's normal to feel tired — it means you worked hard."

CLOSE — use the correct variant:
No escalation flag: "Thanks ${n}, I've got everything I need. Dr Smith will have your full summary before your appointment on 29 April. Well done on completing your session today."
Escalation flag raised: "Thanks for being honest about the pain, ${n}. Dr Smith will have all the details before your appointment on 29 April — they'll be able to go through it with you properly. Take it easy today."

Then say: "Here's a summary of today's session that Dr Smith will receive:" and display the report.

OUTPUT — CHECK-IN REPORT format:

---
**Check-in Report**
**Patient:** ${n}
**Exercises prescribed:** Lunge stretch, Hip flexor stretch, Cross body shoulder stretch

**Pain**
[For each exercise where pain was reported: Exercise name: Score/10 — location — description — still present yes/no — Below threshold logged OR ⚠ ABOVE THRESHOLD — flagged for Dr Smith]
[If no pain: None reported]

**Adherence**
[All completed / Partially completed — exercises skipped / Not completed — reason]

**Confidence**
[High / Moderate — uncertain about exercise / Low — uncertain about exercise]

**Difficulty**
[Low / Moderate / High — detail if given]
---

Then close: "You're all set, ${n}. See you on 29 April!"

GUARDRAILS: You are not a medical professional. If ${n} asks if pain is serious: "That's exactly what Dr Smith will be able to help with." If acute emergency described: "That sounds like something that needs attention straight away — please contact Dr Smith's practice or your nearest urgent care." Never use the words "flag", "threshold", "report", "data", or "assessment" in the conversation. Never skip the report output.`;
    }

    // ── State ──────────────────────────────────────────────────────────────────

    let apiKey = '';
    let userName = '';
    let currentMode = '';
    let conversationHistory = [];

    // ── Screen navigation ──────────────────────────────────────────────────────

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function triggerShake(el) {
      el.classList.remove('shake');
      void el.offsetWidth;
      el.classList.add('shake');
      el.addEventListener('animationend', () => el.classList.remove('shake'), { once: true });
    }

    // ── Screen 1: API key ──────────────────────────────────────────────────────

    function submitApiKey() {
      const el = document.getElementById('api-key-input');
      const val = el.value.trim();
      if (!val) { triggerShake(el); return; }
      apiKey = val;
      showScreen('screen-name');
      document.getElementById('name-input').focus();
    }

    document.getElementById('api-key-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') submitApiKey();
    });

    // ── Screen 2: Name ─────────────────────────────────────────────────────────

    function submitName() {
      const el = document.getElementById('name-input');
      const val = el.value.trim();
      if (!val) { triggerShake(el); return; }
      userName = val;
      showScreen('screen-home');
    }

    document.getElementById('name-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') submitName();
    });

    // ── Screen 3: Home ─────────────────────────────────────────────────────────

    function startMode(mode) {
      currentMode = mode;
      conversationHistory = [];
      document.getElementById('message-area').innerHTML = '';
      hideError();
      updateNav();
      showScreen('screen-chat');
      document.getElementById('chat-input').focus();
      triggerBegin();
    }

    // ── Screen 4: Chat — nav ───────────────────────────────────────────────────

    function switchMode(mode) {
      if (mode === currentMode) return;
      currentMode = mode;
      conversationHistory = [];
      document.getElementById('message-area').innerHTML = '';
      hideError();
      updateNav();
      triggerBegin();
    }

    function updateNav() {
      document.getElementById('nav-onboarding').classList.toggle('active', currentMode === 'onboarding');
      document.getElementById('nav-checkin').classList.toggle('active', currentMode === 'checkin');
    }

    // ── Chat logic ─────────────────────────────────────────────────────────────

    function handleSend() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      appendBubble('user', text);
      conversationHistory.push({ role: 'user', content: text });
      requestResponse();
    }

    document.getElementById('chat-input').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
    });

    async function triggerBegin() {
      conversationHistory.push({ role: 'user', content: 'begin' });
      await requestResponse();
    }

    async function requestResponse() {
      setInputEnabled(false);
      const typingRow = appendTyping();
      try {
        const text = await callApi();
        typingRow.remove();
        conversationHistory.push({ role: 'assistant', content: text });
        renderAssistantMessage(text);
        hideError();
      } catch {
        typingRow.remove();
        showError();
        conversationHistory.pop();
      } finally {
        setInputEnabled(true);
      }
    }

    async function callApi() {
      const system = currentMode === 'onboarding'
        ? buildOnboardingPrompt(userName)
        : buildCheckinPrompt(userName);

      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-5',
          max_tokens: 1024,
          system,
          messages: conversationHistory
        })
      });
      if (!res.ok) throw new Error(`${res.status}`);
      const data = await res.json();
      return data.content[0].text;
    }

    // ── Rendering ──────────────────────────────────────────────────────────────

    function renderAssistantMessage(text) {
      const isOnboarding = currentMode === 'onboarding';
      const hasReport = isOnboarding
        ? /\*\*Patient Snapshot/.test(text)
        : /\*\*Check-in Report/.test(text);
      const reportLabel = isOnboarding ? 'PATIENT SNAPSHOT' : 'CHECK-IN REPORT';

      if (hasReport) {
        const parts = text.split(/\n---\n/);
        if (parts.length >= 2) {
          const before = parts[0].trim();
          const content = parts[1].trim();
          const after = parts.slice(2).join('\n---\n').trim();
          if (before) appendBubble('movy', before);
          appendReportCard(reportLabel, content);
          if (after) appendBubble('movy', after);
          return;
        }
      }
      appendBubble('movy', text);
    }

    function appendBubble(role, text) {
      const area = document.getElementById('message-area');
      const row = document.createElement('div');
      row.className = `msg-row ${role}`;
      const b = document.createElement('div');
      b.className = `bubble ${role === 'movy' ? 'movy-bubble' : 'user-bubble'}`;
      b.textContent = text;
      row.appendChild(b);
      area.appendChild(row);
      scrollBottom();
    }

    function appendReportCard(label, content) {
      const area = document.getElementById('message-area');
      const row = document.createElement('div');
      row.className = 'msg-row movy';
      const card = document.createElement('div');
      card.className = 'report-card';
      const lbl = document.createElement('div');
      lbl.className = 'report-label';
      lbl.textContent = label;
      const body = document.createElement('div');
      body.className = 'report-body';
      body.textContent = content;
      card.appendChild(lbl);
      card.appendChild(body);
      row.appendChild(card);
      area.appendChild(row);
      scrollBottom();
    }

    function appendTyping() {
      const area = document.getElementById('message-area');
      const row = document.createElement('div');
      row.className = 'msg-row movy';
      row.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
      area.appendChild(row);
      scrollBottom();
      return row;
    }

    function scrollBottom() {
      const area = document.getElementById('message-area');
      area.scrollTop = area.scrollHeight;
    }

    function setInputEnabled(on) {
      const input = document.getElementById('chat-input');
      const btn = document.getElementById('send-btn');
      input.disabled = !on;
      btn.disabled = !on;
      if (on) input.focus();
    }

    function showError() { document.getElementById('error-msg').classList.add('visible'); }
    function hideError() { document.getElementById('error-msg').classList.remove('visible'); }
  </script>
</body>
</html>
